name: Windows test build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/windows-build.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore packages
        run: nuget restore "RBX Alt Manager.sln" -NonInteractive
      - name: Build Release
        run: msbuild "RBX Alt Manager.sln" /t:Rebuild /p:Configuration=Release "/p:Platform=Any CPU" /m /v:minimal
      - name: Package Windows application
        shell: pwsh
        run: |
          Copy-Item HUONG_DAN.md, LICENSE build/Release/
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path build/Release/* -DestinationPath artifacts/Roblox-Manager-Windows.zip
          $hash = (Get-FileHash artifacts/Roblox-Manager-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Roblox-Manager-Windows.zip" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Roblox-Manager-Windows
          path: artifacts/*
      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          Tải Roblox-Manager-Windows.zip, giải nén toàn bộ vào thư mục riêng rồi chạy Roblox Manager.exe.

          Yêu cầu Windows với .NET Framework 4.7.2 trở lên; cài Visual C++ Redistributable 2015–2022 nếu máy chưa có.

          Build Release bằng MSBuild trên Windows. Chưa kiểm thử đăng nhập hoặc khởi chạy Roblox. Giữ Check for Updates tắt để tránh bộ cập nhật gốc ghi đè bản Parallel.
          '@ | Set-Content artifacts/release-notes.md -Encoding utf8
          gh release view v1.0.0-test *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.0-test artifacts/Roblox-Manager-Windows.zip artifacts/SHA256SUMS.txt --clobber
          } else {
            gh release create v1.0.0-test artifacts/Roblox-Manager-Windows.zip artifacts/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Roblox Manager — Windows test build" --notes-file artifacts/release-notes.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
